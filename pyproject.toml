[project]
name = "finance-analyzer"
version = "1.2.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vedant Parashar", email = "vedantparashar18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
    "yfinance>=1.8.0",
]

[project.scripts]
finance-analyzer = "finance_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
